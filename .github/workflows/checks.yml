# Runs the checks in .pre-commit-config.yaml on every pull request and on every change to main, so
# that they run even for changes made in GitHub's web editor. The result shows on the pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check the manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the repository's files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run the checks
        run: |
          python -m pip install --quiet -r requirements.txt
          pre-commit run --all-files --show-diff-on-failure
