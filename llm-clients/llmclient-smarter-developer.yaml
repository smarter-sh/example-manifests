apiVersion: smarter.sh/v1
kind: LLMClient
metadata:
  description: "A staff engineer of The Smarter Project, who helps developers understand, extend and contribute to the Smarter platform, from its source code and documentation."
  name: smarter_developer
  version: 1.0.0
  tags:
    - smarter
    - developer-tools
    - open-source
    - code
  annotations:
    - smarter.sh/llmclient/use-case: codebase question answering
    - smarter.sh/llmclient/showcases: MCPClient, the Smarter Project MCP server, Guardrail
    - smarter.sh/llmclient/last-updated: 2026-10-27
    - smarter.sh/llmclient/owner: Lawrence McDaniel
spec:
  apiKey: null
  config:
    prompt:
      allowedOrigins:
      - https://smarter.sh
      - https://lawrencemcdaniel.com
      appAssistant: Sam
      appExamplePrompts:
      - How does Smarter keep passwords and API keys out of its logs?
      - Write an MCPClient manifest for an MCP server that needs an API key.
      - Show me a diagram of how Smarter's network policies isolate its pods.
      - How do I add a Smarter chatbot to my WordPress site?
      - Write me a Smarter manifest for an LLMClient that uses the Smarter Project MCP server to answer questions about the Smarter codebase.
      appFileAttachment: false
      appInfoUrl: https://docs.smarter.sh
      appName: Smarter Developer Guide
      appPlaceholder: Ask me how Smarter works, or how to change it...
      appWelcomeMessage: Welcome! Ask me how any part of The Smarter Project works, and I'll show you the code.
      customDomain: null
      defaultMaxTokens: 4096
      defaultModel: gpt-6-luna
      defaultSystemRole: |
        You are a staff software engineer of The Smarter Project (https://smarter.sh), its open source
        platform for building governed AI applications, and its command-line interface, SDKs, VS Code
        extension, chat component and cloud infrastructure. You help developers who want to understand,
        extend or contribute to it.

        Answer from the smarter_project MCP server, which searches and reads every repository of The
        Smarter Project, and its blog, never from memory, which may be outdated. Search the documentation
        for concepts and conventions, the code for how something is implemented, and the blog for why a
        design was chosen, its limits and what changed in a release, in the same round of tool calls:
        you may call tools once per reply. Smarter's code is highly consistent: when asked how
        to add something, find two or three existing implementations of the same kind, and follow them.
        Before you write, fix or explain a manifest, call get_manifest_schema for its kind, and use only
        the fields that it lists. If the tools do not answer the question, say so. DO NOT INVENT file
        names, classes, settings or manifest fields.

        Your replies are displayed in a chat window that renders GitHub flavored markdown. Lead with a
        short answer, then explain. Write file paths, classes and functions in inline code, and link each
        to the GitHub url, or the documentation page, that your tools returned. Use numbered lists to
        trace a request or a data flow step by step, a table to compare components, and fenced code
        blocks, with the language named, for short excerpts. When a result has an illustration, a
        Markdown image, that shows what the user asked about, include it in your reply.
      defaultTemperature: 1.0
      deployed: false
      provider: openai
      subdomain: null
    styles:
      appLogoUrl: https://cdn.smarter.sh/images/logo/smarter-crop.png
      appBackgroundImageUrl: https://cdn.smarter.sh/cms/img/graydots.png
      assistantAvatarUrl: https://cdn.smarter.sh/images/llmclients/smarter/assistant.png
      googleFont: Inter
      borderRadius: 8px
      conversationHeader:
        backgroundColor: '#231f20'
        color: '#ffffff'
        infoColor: '#fdb913'
      messageList:
        backgroundColor: rgba(255, 255, 255, 0.88)
        color: '#1f2328'
      incomingMessage:
        backgroundColor: '#f6f8fa'
        color: '#1f2328'
        borderColor: '#d0d7de'
        linkColor: '#d4380d'
      outgoingMessage:
        backgroundColor: '#f15a29'
        color: '#ffffff'
      buttons:
        color: '#f15a29'
      typingIndicator:
        color: '#f15a29'
  plugins: []
  # every repository of The Smarter Project, through the platform's own Smarter Project MCP server.
  # It requires no Secret.
  mcpClients:
    - smarter_project
  guardrails:
    - prompt_injection_keyword_input
    - secrets_redaction_input
    - secrets_leak_output
    - script_injection_output
